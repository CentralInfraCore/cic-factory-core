schema_version: "1.0"

# Identification
job_id: ""                  # unique, e.g. "relay-crypto-001" or uuid
parent_job_id: ""           # parent job id if this is a child job; "" for root

# Hierarchy level
level: ""                   # orchestrator | repo | domain
target:
  repo: ""                  # e.g. "CIC-Relay"
  path: ""                  # e.g. "core/nexus/crypto"; required at domain level

# KB context
kb_focus: []                # chunk-ids (c…) or node-ids (n…), e.g. ["c781", "c912"].
                            # run-job.sh injects these into the prompt as a mandatory
                            # first-read list — not a hint. Inline or block list both parse.

# Agent
agent:
  config_dir: ""            # CLAUDE_CONFIG_DIR value, e.g. "~/.claude-personal/agents/agent-01"
  model: ""                 # REQUIRED — validate-spec.sh K10 rejects an empty value.
                            # Current ids: claude-opus-5 | claude-sonnet-5 | claude-haiku-4-5
                            # (claude-sonnet-4-6 and claude-opus-4-8 are still active.)
                            # Claude Code aliases also work: opus | sonnet | haiku
  max_turns: ""             # optional hard runaway guard. Empty → level-based default:
                            # domain 40, repo 60, orchestrator 80.
  session_id: ""            # optional; Claude Code session UUID, set by run-job.sh after each run.
                             # Used by `run-job.sh <job-id> <agent-id> --resume` to continue
                             # exactly where a session-limit/error cutoff happened.

# Workplace — agent saját klónjában, nem a live workdir-ban
# Clone helye: ~/.claude-personal/agents/<id>/workspace/<job-id>/
workplace:
  repos: []                 # klónozandó repók, pl. ["cic-factory", "github_private"]
  branch: ""                # feature branch neve, pl. "feature/kb-repos"

# Status
#
#   pending -> running -> awaiting_review -> done
#                      \-> error
#
# Who may set what:
#   run-job.sh          pending -> running, and running -> awaiting_review | error
#   the orchestrator    awaiting_review -> done, and only after validate-output.sh
#                       passed and jobs/<job-id>/review.md exists
#
# An agent exiting 0 means the agent finished, not that the job is acceptable.
# Those are different claims and they get different states.
status: "pending"           # pending | running | awaiting_review | done | error
spec_gate: ""               # written by run-job.sh: "passed" | "skipped"
                            # "skipped" means it was started with --skip-spec-gate,
                            # i.e. no machine GO -- the review has to know that.
                            # Empty means the job predates this field.
                            # "skipped" blocks close-job.sh unless review.md
                            # acknowledges it -- see /job-close C5.
lease_expires: ""           # written by run-job.sh with the running commit, so it
                            # reaches the remote. A job still claiming "running"
                            # past this instant is stuck: the wrapper died without
                            # correcting it. Detectable from the repo alone --
                            # tools/check-stale-jobs.sh -- with no cooperation
                            # from the dead process. Cleared when the run ends.
run_id: ""                  # a futási kísérlet azonosítója; a running átmenet írja.
                            # A finalizer ehhez köti az írási jogosultságát: egy
                            # régi futás nem veheti vissza azt a jobot, amit
                            # közben egy újabb attempt birtokol.
attempt: ""                 # hányadik kísérlet; a running átmenet lépteti.
error_message: ""           # only when status: error

# Usage — written by run-job.sh from `claude --output-format json`.
# Do not fill in by hand; it is overwritten on every run.
#
# Token counts are aggregated across ALL models a run used (main + auxiliary),
# taken from the JSON's `modelUsage` block. Verified: the per-model costUSD
# values sum exactly to total_cost_usd, which is what makes it the right source.
#
# READ total_input_tokens, NOT input_tokens. `input_tokens` is only the UNCACHED
# share; on a cached run it is near-zero (measured: 529 uncached vs 15912
# cache-read + 8634 cache-write). Reporting input_tokens alone understates a run
# by an order of magnitude.
usage:
  runs: ""                          # how many times the job ran; --resume increments
  cost_usd: ""                    # authoritative aggregate
  turns: ""
  max_turns: ""
  stop_reason: ""                 # end_turn | error_max_turns | …
  duration_ms: ""
  models: ""                      # comma-separated, every model the run touched
  total_input_tokens: ""          # input + cache_read + cache_creation
  input_tokens: ""                # uncached input only
  cache_read_input_tokens: ""
  cache_creation_input_tokens: ""
  output_tokens: ""

# Timestamps (ISO 8601)
timestamps:
  created: ""
  started: ""
  completed: ""
