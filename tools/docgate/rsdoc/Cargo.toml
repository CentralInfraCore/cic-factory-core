[package]
name = "rsdoc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust helper of the documentation gate (tools/docgate): lists items without a doc comment."

# A workspace of its own, so a repository's root workspace never claims it.
[workspace]

[dependencies]
syn = { version = "2", features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
