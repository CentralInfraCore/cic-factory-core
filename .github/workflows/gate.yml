name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A kapu olvas és tesztel. Írási jogot semmihez nem használ, tehát nem is kap:
# a repository default engedélye enélkül write-ot adna a GITHUB_TOKEN-nek.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Egy beragadt lépés eddig a runner saját limitjéig futott. A teljes szett
    # ~40 másodperc; a 15 perc bőven fér, és egy végtelen ciklust megfog.
    timeout-minutes: 15
    steps:
      # SHA-ra pinelve: a mozgó tag beszállítási út abba a lépésbe, ami az
      # ellenőrizendő kódot behozza.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # verify-signatures.sh needs the commits a PR introduces, and the merge
          # base to find them. The default shallow clone has neither.
          fetch-depth: 0

      # The repository is shell, YAML and Python. These first steps prove those
      # parse and that the shell passes shellcheck. Behaviour is covered further
      # down by two suites -- see the comment above them for what each one can
      # and cannot see. Nothing here runs a job end to end.
      - name: shell syntax
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            bash -n "$f"
            n=$((n+1))
          done < <(git ls-files '*.sh')
          echo "bash -n: $n scripts"
          test "$n" -gt 0

      # Egy helyen, a futás elején: eddig a shellcheck a saját lépésében
      # apt-update-elt, a gettext-base pedig hetven sorral lejjebb települt.
      - name: system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck gettext-base

      - name: python dependencies
        run: pip install -q 'jsonschema==4.26.0' 'PyYAML==6.0.3'

      - name: declared dependencies are present
        run: bash tools/check-dependencies.sh

      - name: dependency checker can fail
        run: bash tools/test-check-dependencies.sh

      - name: shellcheck
        run: |
          set -euo pipefail
          git ls-files '*.sh' | xargs shellcheck --severity=error

      - name: meta schema matches its template
        run: bash tools/validate-meta.sh --template

      - name: schema validator itself
        run: bash tools/test-validate-meta.sh

      - name: yaml and json parse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys, yaml
          files = subprocess.check_output(
              ["git", "ls-files", "*.yaml", "*.yml", "*.json"], text=True).split()
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  (json.load if f.endswith(".json") else yaml.safe_load)(fh)
          print(f"parsed: {len(files)} files")
          sys.exit(0 if files else 1)
          PY

      - name: python compile
        run: |
          set -euo pipefail
          mapfile -t py < <(git ls-files '*.py')
          if [ "${#py[@]}" -gt 0 ]; then
            python3 -m py_compile "${py[@]}"
            echo "compiled: ${#py[@]} files"
          fi

      # A lépés fölött csak a követett .py fájlok fordultak -- egyetlen fájl. A
      # shell heredocokba ágyazott Python (a run-job.sh-ban öt blokk, együtt
      # nagyjából 250 sor, benne minden állapotírás) soha nem került parserhez.
      # A core/@v0.1.1 pont így szállított IndentationError-t a finalizerben,
      # zöld kapu mellett.
      - name: embedded python syntax
        run: bash tools/check-embedded-python.sh

      - name: embedded python checker can fail
        run: bash tools/test-check-embedded-python.sh

      # A context-monitor hook három helyen adott fájlból olvasott értéket
      # $(( ))-nek. A bash az aritmetikai kifejezésben talált command
      # substitutiont végrehajtja, tehát mindhárom parancsvégrehajtás volt --
      # az állapotfájlok pedig /tmp-ben, kiszámítható néven éltek.
      - name: context-monitor hook security
        run: bash tools/test-context-monitor.sh

      # Minden meta.yaml mezőolvasás egy helyen, valódi YAML-parserrel. Két
      # kontroll korábban sorvégi kommenttel megkerülhető volt, mert minden
      # olvasó saját regexet hozott (#29, #30).
      - name: meta field reads
        run: bash tools/test-meta-get.sh

      - name: meta field writes
        run: bash tools/test-meta-set.sh

      # A származtatott index korábban saját regexes olvasót hozott, és nem
      # volt saját tesztje: közvetve lefutott mindenhol, tartalmi assertion
      # nélkül.
      - name: generated index matches the metas
        run: bash tools/test-update-index.sh

      # A signer az a pont, ahol a provenance keletkezik. CA hiányában eddig
      # figyelmeztetett, `curl -k`-ra váltott, és a Vault tokent így küldte el.
      - name: commit-msg signer trust boundary
        run: bash tools/test-commit-msg-signer.sh

      # A prompt és a path határa: mi kerülhet be az input.md-ből a modellhez,
      # és milyen alakú azonosítóból épülhet törölhető útvonal.
      - name: prompt and path boundaries
        run: bash tools/test-run-job-boundaries.sh

      # A remote a bizalom forrása: egy elutasított push eddig helyben hagyta a
      # futást, és a remote azt mutatta, ami korábban volt. Ehhez nem kell két
      # job — egy job plusz bármilyen más push a main-re elég.
      - name: push reconciliation
        run: bash tools/test-push-reconciliation.sh

      # A lifecycle-commit csak a saját job path-jait viheti: pathspec nélkül
      # mindent commitolt, ami stage-elve volt, akármelyik futás tette oda.
      - name: lifecycle commits stay in scope
        run: bash tools/test-commit-scope.sh

      # Behaviour, not just syntax. The finalizer suite covers the SIGPIPE/SIGTERM
      # incident; the lifecycle suite covers the transition run-job.sh performs,
      # which the finalizer suite is structurally blind to -- it only extracts the
      # prelude, and the status decision lives below it.
      - name: finalizer behaviour
        run: bash tools/test-run-job-finalizer.sh

      - name: lifecycle transitions
        run: bash tools/test-lifecycle-transitions.sh

      - name: close-job refusals
        run: bash tools/test-close-job.sh

      - name: run-job spec gate
        run: bash tools/test-run-job-spec-gate.sh

      - name: hook installer idempotency
        run: bash tools/test-install-claude-hooks.sh

      - name: stale job detection
        run: bash tools/test-stale-jobs.sh

      - name: docs consistency
        run: bash tools/check-docs.sh

      - name: docs checker itself
        run: bash tools/test-check-docs.sh

      # A SPEC.md use-case szerződése nem állíthat többet a megvalósításnál:
      # minden UC hordozza mind az öt részt, a nem teljes státusz megnevezi a
      # nyitott issue-t, és nincs dokumentált done-út kapu és review nélkül.
      - name: sequence contract matches the implementation
        run: bash tools/check-sequences.sh

      - name: sequence checker can fail
        run: bash tools/test-check-sequences.sh

      # A README-ben deklarált check-számok egyeznek-e a valósággal. Külön
      # script, mert lefuttatja az összes suite-ot -- a check-docs.sh maga is
      # fut egy suite-ban, tehát egymást hívva rekurzióba mennének.
      - name: declared suite counts match
        run: bash tools/check-suite-counts.sh

      - name: count checker can fail
        run: bash tools/test-check-suite-counts.sh

      # The first test that runs a whole job. It needs a git identity because
      # run-job.sh commits the status transitions.
      - name: end to end, with the echo runner
        run: |
          git config --global user.email "gate@example.invalid"
          git config --global user.name "gate"
          bash tools/test-run-job-e2e.sh

      - name: signature verifier itself
        run: bash tools/test-verify-signatures.sh

      # The hook has been writing signatures since the beginning and nothing read
      # them back. Scope: what this PR introduces. History is out -- 33 commits
      # arrived from the extraction with their signatures deliberately removed,
      # and seven predate the hook.
      - name: signatures on the commits this PR adds
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          bash tools/verify-signatures.sh --range "origin/${{ github.base_ref }}..HEAD"

      # MIT-derived files arrived here once with nothing but a "(MIT)" in a
      # comment. This makes the next one impossible to add silently.
      - name: every source file declares its licence
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            # jobs/<id>/ is an evidence archive, not source: agent output and
            # reviews produced under the rules of their time. A header demanded
            # retroactively there would mean editing the evidence.
            case "$f" in jobs/.schema/*) ;; jobs/*/*) continue ;; esac
            if ! head -8 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "no SPDX header: $f"
              missing=1
            fi
          done < <(git ls-files '*.sh' '*.py')
          test "$missing" -eq 0

      # A teljes LICENSE hashelése kizárta a §7 szerinti függeléket is, amit
      # maga a licenc enged. A checker a függelék ELŐTTI részt hasheli: az
      # AGPL-szöveg ugyanúgy sérthetetlen, a kikötés viszont ott áll, ahol
      # irányadó.
      - name: licence files agree
        run: bash tools/check-licence.sh

      - name: licence checker can fail
        run: bash tools/test-check-licence.sh
